name: Main Deploy
# 主发布文件（调度器）：检测本次变更位于哪个子项目，再路由到前端/后端发布流程
on:
  # 代码推送到main分支，自动触发流水线
  push:
    branches:
      - main
  # 网页手动点击Run workflow运行，方便调试（默认前端+后端都跑）
  workflow_dispatch:

jobs:
  # 步骤一：检测变更范围
  detect:
    runs-on: [self-hosted, Windows, X64]
    outputs:
      frontend: ${{ steps.changes.outputs.frontend_any_changed }}
      backend: ${{ steps.changes.outputs.backend_any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史才能 git diff 对比前后提交

      - name: 计算变更范围
        id: changes
        shell: powershell
        run: |
          # 手动触发：默认前端、后端都发布
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "frontend_any_changed=true"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "backend_any_changed=true"
            exit 0
          }

          # 推送事件：对比本次推送的前/后提交，判断哪些目录有改动
          $base = $env:GITHUB_EVENT_BEFORE
          $head = $env:GITHUB_EVENT_AFTER
          # 首次推送时 before 为全 0，回退到上一个提交
          if ($base -match '^0+$') { $base = "$head~1" }

          $changed = git diff --name-only "$base" "$head"
          $frontend = (($changed | Where-Object { $_ -like 'PMD_React/*' }) | Measure-Object).Count -gt 0
          $backend  = (($changed | Where-Object { $_ -like 'PMD_Backend/*' }) | Measure-Object).Count -gt 0

          $frontendStr = if ($frontend) { 'true' } else { 'false' }
          $backendStr  = if ($backend)  { 'true' } else { 'false' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "frontend_any_changed=$frontendStr"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "backend_any_changed=$backendStr"
          Write-Host "变更范围 -> frontend=$frontendStr, backend=$backendStr"

  # 步骤二：前端发布（PMD_React 有改动时执行）
  deploy-frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/deploy-frontend.yml

  # 步骤三：后端发布（PMD_Backend 有改动时执行）
  # needs 串联 deploy-frontend —— 两者都有改动时，先跑完前端再跑后端
  # always() + 排除 failure/cancelled —— 保证「仅后端改动」时前端被跳过，后端仍能正常运行
  deploy-backend:
    needs: [detect, deploy-frontend]
    if: >-
      always() &&
      needs.detect.outputs.backend == 'true' &&
      needs.deploy-frontend.result != 'failure' &&
      needs.deploy-frontend.result != 'cancelled'
    uses: ./.github/workflows/deploy-backend.yml
