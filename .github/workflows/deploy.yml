name: 自动部署流水线
# 并发控制：防止短时间多次提交，多个流水线同时跑，造成文件占用冲突！Windows环境必加
concurrency:
  group: "pmd-deploy"
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  # 网页手动点击Run workflow运行，方便调试（默认前端+后端都发布）
  workflow_dispatch:

jobs:
  detect-changes:
    name: 检测代码变更目录
    runs-on: self-hosted
    outputs:
      backend_changed: ${{ steps.out.outputs.backend }}
      frontend_changed: ${{ steps.out.outputs.frontend }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dorny/paths-filter 需要完整历史来对比前后提交

      # 推送事件：用 dorny/paths-filter 判断本次改动落在哪个子项目
      - name: 判断改动目录 (push)
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'PMD_Backend/**'
            frontend:
              - 'PMD_React/**'

      # 手动触发：默认前端、后端都发布
      - name: 手动触发默认全部发布 (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: filter-dispatch
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_OUTPUT -Value "backend=true"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "frontend=true"

      # 归一化输出：推送用 dorny 结果，手动触发强制都发
      - name: 归一化输出
        id: out
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $backend = 'true'; $frontend = 'true'
          } else {
            $backend = '${{ steps.filter.outputs.backend }}'
            $frontend = '${{ steps.filter.outputs.frontend }}'
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "backend=$backend"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "frontend=$frontend"
          Write-Host "变更范围 -> backend=$backend, frontend=$frontend"

  deploy-backend-job:
    name: 部署后端
    needs: detect-changes
    # 仅当后端目录有改动，才执行后端job
    if: ${{ needs.detect-changes.outputs.backend_changed == 'true' }}
    uses: ./.github/workflows/deploy-backend.yml

  deploy-frontend-job:
    name: 部署前端
    # 两种情况：
    # 1. 后端job执行完成之后，再跑前端（同时改前后端时串行）
    # 2. 如果后端没触发（仅改前端），靠 always() 守卫避免被级联跳过，直接依赖 detect-changes 运行
    needs: [detect-changes, deploy-backend-job]
    if: >-
      always() &&
      needs.detect-changes.outputs.frontend_changed == 'true' &&
      needs.deploy-backend-job.result != 'failure' &&
      needs.deploy-backend-job.result != 'cancelled'
    uses: ./.github/workflows/deploy-frontend.yml
